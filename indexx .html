<script src="https://cdn.tailwindcss.com/3.4.17"></script>

<body class="bg-slate-50 font-sans antialiased text-slate-800 min-h-screen">
<!-- APP CONTAINER -->
<div id="app">
<!-- Views will be dynamically injected here -->
</div>
<!-- JAVASCRIPT LOGIC & VIEWS -->
<script>
// State Management
const state = {
currentView: 'welcome', // 'welcome', 'login', 'dashboard'
portalType: 'Student', // Student, Lecturer, Admin
activeTab: 'Overview' // Overview, Academic Status, Result Summary, Outstanding Courses, Eligibility, Confirmation, Clearance, ID Card
};
// Render Engine
function render() {
const app = document.getElementById('app');
app.innerHTML = '';
if (state.currentView === 'welcome') {
app.innerHTML = renderWelcomeView();
} else if (state.currentView === 'login') {
app.innerHTML = renderLoginView();
} else if (state.currentView === 'dashboard') {
app.innerHTML = renderDashboardRouter();
}
}
// 1. WELCOME SCREEN VIEW
function renderWelcomeView() {
return `
<div class="min-h-screen flex flex-col md:flex-row w-full">
<!-- Left Hero Section -->
<div class="w-full md:w-1/2 bg-white flex flex-col items-center justify-center p-12 border-r border-slate-100">
<div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-6 flex items-center justify-center w-36 h-36">
<!-- FCE Osiele Logo representation -->
<img src="${CREST}" alt="Federal College of Education, Abeokuta crest" class="w-24 h-auto">
</div>
<h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">Welcome to FCE Osiele</h1>
</div>
<!-- Right Module Selector Section -->

<div class="space-y-4">

<div onclick="selectPortal('Student')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hover:border-brand-blue cursor-pointer transition-all flex items-center gap-4 group">
<div class="w-12 h-12 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-xl shadow-sm group-hover:scale-105 transition-transform">

<div>

</div>
</div>

<div onclick="selectPortal('Lecturer')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hover:border-brand-blue cursor-pointer transition-all flex items-center gap-4 group">
<div class="w-12 h-12 rounded-xl bg-amber-500/20 text-amber-600 flex items-center justify-center text-xl shadow-sm group-hover:scale-105 transition-transform">

<div>

</div>
</div>

// ===== SHARED DATA (from Chapters Three and Four) =====
const STUDENTS = [
{m:'25/300131',n:'ADETONA RACHEAL TOYOSI'},{m:'25/300135',n:'AJIBADE ADEJOKE BENEDICTA'},{m:'25/300137',n:'AKINTADE PEACE MOYINOLUWA'},
{m:'25/300143',n:'ELEGEBEDE PAUL OLOYEDE'},{m:'25/300146',n:'IDRIS FATIMAH ALAGBO'},{m:'25/300149',n:'KAYODE AYODEJI OLUWAFEMI'},
{m:'25/300151',n:'LAWAL NOAH MUHAMMED'},{m:'25/300175',n:'OGUNSOLA USMAN ADEBAYO'},{m:'25/300047',n:'IDOWU ADURAGBEMI OLAYINKA'}];
const STAFF = {
ACA001:{name:'Sample Clearance Officer (Department)',unit:'Department',role:'Clearance Officer'},
ACA002:{name:'Sample Clearance Officer (Registry)',unit:'Registry',role:'Clearance Officer'},
REG001:{name:'Sample Registry Officer',unit:'Registry',role:'Registry Officer'},
ICT001:{name:'Sample System Administrator',unit:'ICT',role:'Administrator/ICT'}};
const REQS = [{id:1,name:'All required courses passed',unit:'Department'},{id:2,name:'Results intact',unit:'Registry'},{id:3,name:'No outstanding courses',unit:'Department'}];
const DEPTS = ['Computer Science','Biology','Chemistry','Mathematics'];
const PEND = {'25/300149':'Met,Met,Pending','25/300151':'Met,Pending,Met','25/300175':'Pending,Met,Pending','25/300047':'Met,Pending,Met'};
const recs = {}, AUDIT = [], NOTES = [];
let letterSeq = 0;
const NOW = () => new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const statusOf = r => r.st.includes('Not Met') ? 'Not Eligible' : r.st.every(x => x === 'Met') ? 'Eligible' : 'Pending';
STUDENTS.forEach(s => {
recs[s.m] = {st:(PEND[s.m]||'Met,Met,Met').split(','), cm:['','',''], fin:false, letter:null, code:null, finAt:null};
recs[s.m].st.forEach((x,i) => { if (x === 'Pending') recs[s.m].cm[i] = 'Verification in progress.'; });
});
const me = () => STUDENTS.find(s => s.m === (state.matric || '25/300143'));
const staff = () => STAFF[state.staffId || 'ACA001'];
const badge = s => `<span class="${s==='Eligible'||s==='Met'?'bg-emerald-100 text-emerald-700':s==='Pending'?'bg-amber-100 text-amber-700':'bg-rose-100 text-rose-700'} text-xs px-3 py-1 rounded-full font-medium whitespace-nowrap">${s}</span>`;
const ttl = (h,p) => `<h1 class="text-2xl font-bold text-slate-900 tracking-tight">${h}</h1><p class="text-xs text-slate-500 mt-0.5 mb-6">${p}</p>`;
function loginHint() {
const er = state.loginError && state.loginError.p === state.portalType ? '<span class="block text-rose-600 font-semibold text-xs mb-2">' + state.loginError.msg + '</span>' : '';
return er + loginHint2();
}
function loginHint2() {
if (state.portalType === 'Student') return 'Sign in with your matric number. Your password is your surname (e.g. 25/300143 / ELEGEBEDE).';
if (state.portalType === 'Clearance') return 'Demo staff IDs: ACA001 (Department), ACA002 (Registry unit), REG001 (Registry Officer). Any password.';
if (state.portalType === 'Admin') return 'Demo staff ID: ICT001. Any password.';
return '';
}
// ===== ACTIONS =====
function openDept() { state.clView = 'students'; render(); }
function goView(v) { state.clView = v; render(); }
function openStudent(m) { state.sel = m; state.clView = 'student'; render(); }
function saveReq(m, i) {
const r = recs[m], sel = document.getElementById('sel'+i).value, cm = document.getElementById('cm'+i).value;
const old = statusOf(r), oldReq = r.st[i];
r.st[i] = sel; r.cm[i] = cm;
if (oldReq !== sel) {
AUDIT.unshift({a:state.staffId, t:'Requirement '+(i+1)+' status changed for '+m, o:oldReq, n:sel, w:NOW()});
const nw = statusOf(r);
if (nw !== old) {
if (nw !== 'Eligible') { r.fin = false; r.letter = null; r.finAt = null; r.cid = null; }
AUDIT.unshift({a:state.staffId, t:'Overall status recalculated for '+m, o:old, n:nw, w:NOW()});
statusNotify(m, nw);
}
}
render();
}
function finalise(m) {
const r = recs[m];
if (staff().role !== 'Registry Officer' || statusOf(r) !== 'Eligible') return;
r.fin = true; r.finAt = NOW(); letterSeq++;
r.letter = 'GSL/2026/' + String(letterSeq).padStart(4,'0');
r.code = 'VC-' + Math.random().toString(16).slice(2,12).toUpperCase();
AUDIT.unshift({a:state.staffId, t:'Final approval given for '+m, o:'', n:'Finalised', w:r.finAt});
notify(m, 'Graduation Status Letter available', 'Your graduation eligibility has been approved by the Registry Officer. Your Graduation Status Letter is now available.', true);
render();
}

p.address = document.getElementById('pf-addr').value.trim();
p.mobile = document.getElementById('pf-mob').value.trim();
state.saved = true; render();
}

const YEARS = [[10,33],[10,34],[11,36],[11,37]];

function handleLogin(event) {
